# Render.com Infrastructure-as-Code Blueprint
# Reference: https://render.com/docs/blueprint-spec

services:
  # ── Core Unified SaaS Application (FastAPI + React SPA + Playwright) ──────
  - type: web
    name: job-finder-api
    env: docker
    dockerfilePath: Dockerfile
    plan: standard
    healthCheckPath: /health
    region: oregon
    envVars:
      - key: ENV
        value: production
      - key: MULTI_TENANT_ENABLED
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: job-finder-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: job-finder-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: GEMINI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://job-finder-api.onrender.com

  # ── Redis Cache & Celery Task Queue ───────────────────────────────────────
  - type: redis
    name: job-finder-redis
    region: oregon
    plan: starter
    ipAllowList: []

databases:
  # ── Production Managed PostgreSQL Database ────────────────────────────────
  - name: job-finder-postgres
    region: oregon
    plan: starter
    databaseName: job_finder_db
    user: job_finder_admin
