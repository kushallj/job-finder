services:
  - type: web
    name: job-finder-api
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PORT
        value: 10000
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false
      - key: HUNTER_API_KEY
        sync: false
      - key: SENDER_NAME
        sync: false
      - key: LINKEDIN_URL
        sync: false
