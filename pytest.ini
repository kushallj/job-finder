[pytest]
testpaths = tests
asyncio_mode = auto
addopts = --tb=short -v
markers =

    asyncio: marks tests as async (deselect with '-m "not asyncio"')
    multi_tenant: keep strict auth (skip the legacy single-tenant fallback in conftest)
    network: calls a live third-party service; skipped unless RUN_NETWORK_TESTS=1
