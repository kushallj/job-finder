[project]
name = "job-finder"
version = "2.1.0"
description = "Job-finder monorepo for job discovery, outreach, matching, and research automation."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--tb=short -v"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Repo-wide baseline: real bugs only (syntax, undefined names, unused imports/vars).
# Ruff's own default set is ~800 rules and buries legacy code in noise; stricter
# per-package configs extend this file (see src/jobify/ruff.toml).
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
# Legacy Column() models type as Column[T]; strict mode waits on the Mapped[] migration.
