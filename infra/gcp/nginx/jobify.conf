# nginx site for Jobify on one GCP VM: static frontend + /api reverse proxy, one domain.
# Install: sudo cp infra/gcp/nginx/security-headers.conf /etc/nginx/snippets/jobify-security-headers.conf
#          sudo cp infra/gcp/nginx/jobify.conf /etc/nginx/sites-available/jobify
#          sudo sed -i 's/app.example.com/<your domain>/g' /etc/nginx/sites-available/jobify
#          sudo ln -s /etc/nginx/sites-available/jobify /etc/nginx/sites-enabled/jobify
#          (the certificate must exist first: infra/gcp/setup_vm.sh obtains it via certbot webroot)
#          sudo nginx -t && sudo systemctl reload nginx
#
# Same origin for UI and API (https://app.example.com and https://app.example.com/api), so
# set VITE_API_BASE_URL=https://app.example.com/api and CORS_ORIGINS=https://app.example.com.

# Per-client request rate for the API (burst-tolerant). $binary_remote_addr is the real
# client IP here because nginx is the edge; uvicorn trusts X-Forwarded-For from 127.0.0.1.
limit_req_zone $binary_remote_addr zone=jobify_api:10m rate=20r/s;
limit_req_status 429;

upstream jobify_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;
    # Keep ACME challenges reachable over HTTP (certificate renewals use webroot).
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;   # certbot's maintained TLS settings
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    client_max_body_size 25m;        # inbound email with attachments (API caps others at 2 MB)

    # Security headers: frontend locations include the snippet; /api responses carry the
    # API's own stricter headers (src/api/hardening.py), so they are not duplicated here.

    access_log /var/log/nginx/jobify.access.log;
    error_log  /var/log/nginx/jobify.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=jobify_api burst=40 nodelay;
        proxy_pass http://jobify_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Chat replies stream over SSE: no buffering, long read timeout.
    location ~ ^/api/conversations/[^/]+/messages$ {
        limit_req zone=jobify_api burst=10 nodelay;
        proxy_pass http://jobify_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }

    # Probes for uptime monitoring (booleans only, no internals).
    location = /healthz { proxy_pass http://jobify_api; access_log off; }
    location = /readyz  { proxy_pass http://jobify_api; access_log off; }

    # Everything else of the old API surface (docs, metrics, legacy root routes) stays private.
    location ~ ^/(docs|redoc|openapi\.json|metrics|health)$ { return 404; }

    # ── Frontend (vite build output) ─────────────────────────────────────────
    root /opt/jobify/jobify/dist;
    index index.html;

    location /assets/ {
        include /etc/nginx/snippets/jobify-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA routing: unknown paths render index.html (React Router handles them).
    location / {
        include /etc/nginx/snippets/jobify-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
