# Fields:
#   tier               1 = highest hiring probability right now, 3 = watch-list
#   hiring_probability High | Medium-High | Medium | Low-Medium | Low
#   ats_hint           best-guess ATS for agent_02_ats_hunter.py (greenhouse|lever|ashby|workday|unknown)
#   signals            list of {type, detail, source, date}
#   last_verified      date this row's data was last checked against a live source

