<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Job Finder Companion — Settings</title>
  <style>
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      max-width: 480px; margin: 40px auto; color: #1a1a1a;
    }
    h1 { font-size: 18px; }
    label { display: block; font-size: 13px; color: #444; margin-top: 16px; }
    input {
      width: 100%; padding: 8px 10px; margin-top: 4px; font-size: 13px;
      border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box;
    }
    button {
      margin-top: 16px; padding: 9px 16px; border: none; border-radius: 6px;
      background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; font-size: 13px;
    }
    button:hover { background: #1d4ed8; }
    .status { margin-top: 10px; font-size: 13px; }
    .status.ok { color: #15803d; }
    .status.err { color: #b91c1c; }
    p.note {
      font-size: 12px; color: #777; background: #f7f7f9; border-radius: 8px;
      padding: 10px 12px; margin-top: 20px; line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Job Finder Companion — Settings</h1>

  <label for="apiUrl">Backend URL</label>
  <input type="text" id="apiUrl" placeholder="http://localhost:8000" />
  <button id="saveBtn">Save</button>
  <div id="status" class="status"></div>

  <p class="note">
    This should point at wherever your job-finder backend (<code>main.py</code>)
    is running — by default <code>http://localhost:8000</code>. If you host it
    remotely, use its https URL. On save, the extension will ask Chrome for
    permission to talk to that host.
  </p>

  <script src="options.js"></script>
</body>
</html>
