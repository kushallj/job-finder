# Development Hot-Reload Overlay
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  api-gateway:
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - .:/app
      - /app/__pycache__

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile.dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

  sidekick-brain:
    volumes:
      - ./src:/app/src
      - ./data:/app/data

  crawler-worker:
    volumes:
      - ./src:/app/src
      - ./data:/app/data

  outreach-engine:
    volumes:
      - ./src:/app/src
      - ./data:/app/data
